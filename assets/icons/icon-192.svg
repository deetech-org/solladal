<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A11"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Bezel Gold Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Emerald Tile Gradient -->
    <linearGradient id="greenTile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Amber Tile Gradient -->
    <linearGradient id="amberTile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square Base -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="3" y="3" width="186" height="186" rx="37" fill="none" stroke="url(#bezelGrad)" stroke-width="2.5" opacity="0.9"/>
  <rect x="7" y="7" width="178" height="178" rx="33" fill="none" stroke="#FDE68A" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Top Invocational Banner: அன்பே இறை  LOVE IS DIVINE -->
  <g opacity="0.95">
    <text x="96" y="23" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="7.6" font-weight="700" fill="#FDE68A" text-anchor="middle" letter-spacing="0.5">அன்பே இறை   LOVE IS DIVINE</text>
    <line x1="20" y1="27" x2="172" y2="27" stroke="url(#bezelGrad)" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- Centerpiece Glyph: தமிழ் (Moved Up, Circle Removed) -->
  <text x="96" y="76" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="44" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">தமிழ்</text>

  <!-- 5 Game Tile Boxes spelling [சொ] [ல்] [லா] [ட] [ல்] -->
  <g filter="url(#tileShadow)">
    <!-- Tile 1: [சொ] -->
    <rect x="21" y="102" width="27" height="24" rx="5" fill="url(#greenTile)" stroke="#86EFAC" stroke-width="0.9"/>
    <text x="34.5" y="119" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">சொ</text>

    <!-- Tile 2: [ல்] -->
    <rect x="52" y="102" width="27" height="24" rx="5" fill="url(#amberTile)" stroke="#FDBA74" stroke-width="0.9"/>
    <text x="65.5" y="119" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">ல்</text>

    <!-- Tile 3: [லா] -->
    <rect x="83" y="102" width="27" height="24" rx="5" fill="#334155" stroke="#64748B" stroke-width="0.9"/>
    <text x="96.5" y="119" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="11.5" font-weight="800" fill="#F1F5F9" text-anchor="middle">லா</text>

    <!-- Tile 4: [ட] -->
    <rect x="114" y="102" width="27" height="24" rx="5" fill="url(#greenTile)" stroke="#86EFAC" stroke-width="0.9"/>
    <text x="127.5" y="119" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">ட</text>

    <!-- Tile 5: [ல்] -->
    <rect x="145" y="102" width="27" height="24" rx="5" fill="url(#amberTile)" stroke="#FDBA74" stroke-width="0.9"/>
    <text x="158.5" y="119" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">ல்</text>
  </g>

  <!-- Added Subtitle at bottom: TAMIL WORD GAME -->
  <text x="96" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#F59E0B" text-anchor="middle" letter-spacing="1.5">TAMIL WORD GAME</text>

  <!-- Bottom Invocational Banner: அறமே வழி  VIRTUE IS THE PATH -->
  <g opacity="0.95">
    <line x1="20" y1="168" x2="172" y2="168" stroke="url(#bezelGrad)" stroke-width="0.6" opacity="0.5"/>
    <text x="96" y="179" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="7.6" font-weight="700" fill="#FDE68A" text-anchor="middle" letter-spacing="0.5">அறமே வழி   VIRTUE IS THE PATH</text>
  </g>
</svg>
