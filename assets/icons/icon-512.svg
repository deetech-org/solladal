<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad512" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A11"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Bezel Gold Gradient -->
    <linearGradient id="bezelGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Emerald Tile Gradient -->
    <linearGradient id="greenTile512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Amber Tile Gradient -->
    <linearGradient id="amberTile512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="goldGlow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="tileShadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad512)"/>
  
  <!-- Outer Gold Borders -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="url(#bezelGrad512)" stroke-width="6" opacity="0.9"/>
  <rect x="18" y="18" width="476" height="476" rx="90" fill="none" stroke="#FDE68A" stroke-width="1.8" stroke-dasharray="8,8" opacity="0.4"/>

  <!-- Top Invocational Banner: அன்பே இறை  LOVE IS DIVINE -->
  <g opacity="0.95">
    <text x="256" y="64" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="19.8" font-weight="700" fill="#FDE68A" text-anchor="middle" letter-spacing="1.2">அன்பே இறை   LOVE IS DIVINE</text>
    <line x1="50" y1="76" x2="462" y2="76" stroke="url(#bezelGrad512)" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Centerpiece Glyph: தமிழ் (Moved Up, Circle Removed, Majestic 3D Gold) -->
  <text x="256" y="205" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="116" font-weight="800" fill="url(#goldGrad512)" text-anchor="middle" filter="url(#goldGlow512)">தமிழ்</text>

  <!-- 5 Game Tile Boxes spelling [சொ] [ல்] [லா] [ட] [ல்] (w=72, h=62) -->
  <g filter="url(#tileShadow512)">
    <!-- Tile 1: [சொ] -->
    <rect x="56" y="275" width="72" height="62" rx="12" fill="url(#greenTile512)" stroke="#86EFAC" stroke-width="2.2"/>
    <text x="92" y="319" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">சொ</text>

    <!-- Tile 2: [ல்] -->
    <rect x="138" y="275" width="72" height="62" rx="12" fill="url(#amberTile512)" stroke="#FDBA74" stroke-width="2.2"/>
    <text x="174" y="319" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">ல்</text>

    <!-- Tile 3: [லா] -->
    <rect x="220" y="275" width="72" height="62" rx="12" fill="#334155" stroke="#64748B" stroke-width="2.2"/>
    <text x="256" y="319" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="30" font-weight="800" fill="#F1F5F9" text-anchor="middle">லா</text>

    <!-- Tile 4: [ட] -->
    <rect x="302" y="275" width="72" height="62" rx="12" fill="url(#greenTile512)" stroke="#86EFAC" stroke-width="2.2"/>
    <text x="338" y="319" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">ட</text>

    <!-- Tile 5: [ல்] -->
    <rect x="384" y="275" width="72" height="62" rx="12" fill="url(#amberTile512)" stroke="#FDBA74" stroke-width="2.2"/>
    <text x="420" y="319" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">ல்</text>
  </g>

  <!-- Added Subtitle: TAMIL WORD GAME -->
  <text x="256" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#F59E0B" text-anchor="middle" letter-spacing="3.5">TAMIL WORD GAME</text>

  <!-- Bottom Invocational Banner: அறமே வழி  VIRTUE IS THE PATH -->
  <g opacity="0.95">
    <line x1="50" y1="450" x2="462" y2="450" stroke="url(#bezelGrad512)" stroke-width="1.5" opacity="0.5"/>
    <text x="256" y="475" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="19.8" font-weight="700" fill="#FDE68A" text-anchor="middle" letter-spacing="1.2">அறமே வழி   VIRTUE IS THE PATH</text>
  </g>
</svg>
